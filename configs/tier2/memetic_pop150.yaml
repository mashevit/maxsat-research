# Tier-2 memetic EA — exploration-heavy preset.
# Large population, same cheap polish as the baseline. Tests whether tier-2
# hardness is better attacked by population diversity than by deeper local
# search. See configs/tier2/memetic_base.yaml for the max_gens rationale.
ea:
  enabled: true
  pop_size: 150
  tournament_k: 5
  pmutate: 0.02
  elitism: true
  max_gens: 1000000
ls:
  ls_polish_flips: 700
  time_limit_s: 0.05
  flip_budget: 2000
